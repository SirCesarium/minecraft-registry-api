[package]
name = "minecraft_registry_api"
version = "2.0.2"
edition = "2024"
rust-version = "1.99"
description = "Typed API clients for Minecraft modding platforms — Modrinth, Mojang, Paper, Purpur, Fabric, Forge, NeoForge"
license = "MIT"
authors = ["Cesarium <239650612+SirCesarium@users.noreply.github.com>"]
readme = "README.md"
repository = "https://github.com/SirCesarium/minecraft-registry-api"
documentation = "https://docs.rs/minecraft_registry_api"
keywords = ["minecraft", "modrinth", "api-client", "modding"]
categories = ["api-bindings", "games"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quick-xml = { version = "0.42", features = ["serialize"], optional = true }

[features]
default = ["modrinth", "mojang"]
full = ["modrinth", "mojang", "paper", "purpur", "fabric", "forge", "neoforge"]

modrinth = []
mojang = []
paper = []
purpur = []
fabric = []
forge = ["quick-xml"]
neoforge = ["quick-xml"]

[dev-dependencies]
# Builds reqwest::Response values in the test HTTP hook.
http = "1.5"
tokio = { version = "1", features = ["rt", "macros"] }

[[test]]
name = "fabric"
required-features = ["fabric"]

[[test]]
name = "forge"
required-features = ["forge"]

[[test]]
name = "modrinth"
required-features = ["modrinth"]

[[test]]
name = "mojang"
required-features = ["mojang"]

[[test]]
name = "neoforge"
required-features = ["neoforge"]

[[test]]
name = "paper"
required-features = ["paper"]

[[test]]
name = "purpur"
required-features = ["purpur"]

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
absolute_paths = "deny"

