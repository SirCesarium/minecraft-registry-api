[package]
name = "minecraft_registry_api"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quick-xml = { version = "0.40", features = ["serialize"], optional = true }
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = ["modrinth", "mojang"]
full = ["modrinth", "mojang", "paper", "purpur", "fabric", "forge", "neoforge"]

modrinth = []
mojang = []
paper = []
purpur = []
fabric = []
forge = ["quick-xml"]
neoforge = ["quick-xml"]

[lib]
name = "minecraft_registry_api"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
absolute_paths = "deny"

