name: Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish crate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: true

      - name: Verify tag matches crate version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "minecraft_registry_api") | .version')
          tag="${GITHUB_REF_NAME#v}"

          if [ "$tag" != "$version" ]; then
            echo "error: tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "minecraft_registry_api") | .version')

          if curl -fsS "https://crates.io/api/v1/crates/minecraft_registry_api/$version" > /dev/null; then
            echo "minecraft_registry_api $version is already on crates.io, skipping"
          else
            cargo publish --locked
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
